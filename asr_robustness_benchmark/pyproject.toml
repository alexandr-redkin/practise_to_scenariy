[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "asr-robustness-benchmark"
version = "0.1.0"
description = "Kazakh-Russian multilingual ASR acoustic robustness benchmark"
requires-python = ">=3.10"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
